<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Softphone · Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary:   #0d1117;
      --bg-card:      #161b22;
      --border:       #30363d;
      --text-primary: #e6edf3;
      --text-muted:   #6e7681;
      --accent-green: #3fb950;
      --accent-green-dim: #238636;
      --accent-red:   #f85149;
      --accent-blue:  #58a6ff;
      --font-ui:      'DM Sans', system-ui, sans-serif;
      --font-mono:    'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrap {
      width: 100%;
      max-width: 360px;
      padding: 16px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
    }

    .login-logo-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .login-logo-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 28px 24px;
    }

    .login-card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      color: white;
      background: var(--accent-green-dim);
      border: 1px solid var(--accent-green);
      border-radius: 8px;
      cursor: pointer;
      transition: all 120ms ease;
      margin-top: 4px;
    }

    .btn-login:hover:not(:disabled) {
      background: var(--accent-green);
      box-shadow: 0 0 12px rgba(63,185,80,0.3);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--accent-red);
      margin-top: 12px;
    }

    .error-msg.visible {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Loading spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <span class="login-logo-icon">☎️</span>
      <div class="login-logo-title">Softphone</div>
      <div class="login-logo-sub">Powered by Twilio Voice</div>
    </div>

    <div class="login-card">
      <h2>Sign In</h2>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            autofocus
            required
          />
        </div>
        <button type="submit" class="btn-login" id="btn-login">Sign In</button>
        <div class="error-msg" id="error-msg"></div>
      </form>
    </div>

    <div class="login-footer">Secure browser-based softphone &mdash; Netherlands</div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');
    const passwordInput = document.getElementById('password');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function hideError() {
      errorMsg.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const password = passwordInput.value;
      if (!password) {
        showError('Please enter your password');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/pages/app.html';
        } else {
          showError(data.error || 'Invalid password. Please try again.');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        showError('Connection error. Please check your network and try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
